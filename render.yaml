 services:                                                                                                               
    - type: web                                                                                                           
      name: sam-export-tool                                                                                               
      runtime: python                                                                                                     
      buildCommand: pip install -r requirements.txt                                                                       
      startCommand: gunicorn sam_export.server:app --timeout 120                                                          
      envVars:                                                                                                            
        - key: SAM_API_KEY                                                                                                
          sync: false                                                                                                     
        - key: PYTHON_VERSION                                                                                             
          value: "3.11"
